# Generate the Xcode project with `xcodegen` (brew install xcodegen).
# The .xcodeproj is not checked in; this file is the source of truth.
name: ToddlerGameCenter
options:
  bundleIdPrefix: com.iamnbutler
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  GameCenterKit:
    path: GameCenterKit
targets:
  ToddlerGameCenter:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App
    dependencies:
      - package: GameCenterKit
    settings:
      base:
        PRODUCT_NAME: Toddler Game Center
        PRODUCT_BUNDLE_IDENTIFIER: com.iamnbutler.ToddlerGameCenter
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # iPad only on iOS; the Mac build is a native macOS app, not Catalyst.
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Toddler Games
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.kids-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  ToddlerGameCenter:
    build:
      targets:
        ToddlerGameCenter: all
    run:
      config: Debug
